<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz | Quiz App</title>
  <link rel="stylesheet" href="quiz.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="nav-logo">
  <img src="../ab-prof-logo.svg" width="35" height="35" alt="logo"/>
  AB-PROF
</div>
    <div class="nav-right">
      <span class="category-name" id="categoryName">General</span>
      <button class="quit-btn" id="quitBtn">❌ Quit</button>
    </div>
  </nav>

  <!-- ===== MAIN CONTAINER ===== -->
  <div class="container">

    <!-- Progress Bar -->
    <div class="progress-section">
      <div class="progress-info">
        <span id="questionCount">Question 1/10</span>
        <span id="scoreCount">Score: 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Timer -->
    <div class="timer-section">
      <div class="timer-circle" id="timerCircle">
        <span id="timerText">30</span>
      </div>
    </div>

    <!-- Question -->
    <div class="question-box">
      <h2 id="questionText">Question yahan aayega...</h2>
    </div>

    <!-- Options -->
    <div class="options-grid" id="optionsGrid">
      <button class="option-btn" id="opt0"></button>
      <button class="option-btn" id="opt1"></button>
      <button class="option-btn" id="opt2"></button>
      <button class="option-btn" id="opt3"></button>
    </div>

    <!-- Next Button -->
    <div class="next-section">
      <button class="next-btn" id="nextBtn" style="display:none;">
        Next Question ➡️
      </button>
    </div>

  </div>
<script src="questions.js"></script>
<script type="module" src="quiz.js"></script>
</body>
</html>
