<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winsh Shop | AB-PROF</title>
  <link rel="stylesheet" href="wishshop.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="../firebase.js"></script>
</head>
<body>
  <nav class="navbar">
    <button class="back-btn" onclick="window.location.href='profile.html'">← Back</button>
    <div class="nav-logo">🛒 WINSH SHOP</div>
    <div class="winsh-header">💎 <span id="headerWinsh">0</span></div>
  </nav>

  <div class="shop-container">
    <div class="category-tabs">
      <button class="tab-btn active" data-cat="borders">🌈 Borders</button>
      <button class="tab-btn" data-cat="badges">🏅 Badges</button>
      <button class="tab-btn" data-cat="themes">🎨 Themes</button>
      <button class="tab-btn" data-cat="titles">📜 Titles</button>
    </div>
    <div class="items-grid" id="itemsGrid">
      Loading shop items...
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="../firebase.js"></script>
<script src="shop-script.js"></script>
</body>
</html>
